[project]
name = "vet"
version = "0.1.0"
description = "File triage for SOC analysts: extract VBA macros from Office documents and JavaScript, metadata and embedded files from PDFs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MrWaifu24" }]
requires-python = ">=3.10"
keywords = ["soc", "dfir", "malware-analysis", "triage", "pdf", "vba", "macro", "oletools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "oletools>=0.60.2",
    "pypdf>=5.0",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/MrWaifu24/vet"
Issues = "https://github.com/MrWaifu24/vet/issues"

[project.scripts]
vet = "vet.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is handled by ruff format

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:oletools.*", "ignore::DeprecationWarning:pyparsing.*"]
